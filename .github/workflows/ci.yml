name: CI

# The public agent repository (D-087): vet, test and a static build on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Test as root, like on a server (the allow folder must be owned by root)
        run: sudo -E env "PATH=$PATH" go test ./...
      - name: Static build
        run: CGO_ENABLED=0 go build ./...
