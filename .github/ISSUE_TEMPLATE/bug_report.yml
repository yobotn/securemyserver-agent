name: 🐞 Bug report
description: Something in the agent doesn't work as this README says.
labels: ["🐞 bug"]
body:
  - type: markdown
    attributes:
      value: |
        🔐 **A security problem?** Please don't file it here. Use "Report a vulnerability" on this repository or email security@securemyserver.com (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: 🧐 What happened
      description: What you expected, and what the agent did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 🔁 How to see it again
      placeholder: "1. ...\n2. ..."
  - type: input
    id: version
    attributes:
      label: 🏷️ Agent version
      description: The output of `securemyserver version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 🐧 System
      placeholder: Ubuntu 24.04, amd64
  - type: textarea
    id: logs
    attributes:
      label: 📜 Logs
      description: "`journalctl -u securemyserver --since -1h`. Remove anything private (addresses, hostnames, key comments) first."
      render: text
